name: "first workflow"
on: 
  push:
  pull_request:
  
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm     

      - name: install dependency 
        run: npm ci
      - name: install Es Lint 
        run: npm run lint  

      - name: make react build 
        run: npm run build
 