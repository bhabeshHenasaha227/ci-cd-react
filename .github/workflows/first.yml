name: "first workflow"
on: push
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm 

      - name: install dependency 
        run: npm ci 

      - name: make react build 
        run: npm run build
 