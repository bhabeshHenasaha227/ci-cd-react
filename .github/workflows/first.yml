name: "first workflow"
on: 
  push:
  pull_request:
    branches:
      - main 
      - dev
      - qa
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     

      - name: install dependency 
        run: npm ci
      - name: run EsLint 
        run: npm run lint  

  test-job:
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     

      - name: install dependency 
        run: npm ci

      - name: make react test 
        run: echo "No test script configured yet"
    
  build-job:
    needs: test-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm     

      - name: install dependency 
        run: npm ci
      - name: make react build 
        run: npm run build
      - name: create artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist
          retention-days: 7

 